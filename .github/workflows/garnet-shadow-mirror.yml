name: Shadow dependency mirror
on:
  pull_request:
    paths:
      - .github/scripts/shadow_mirror/**
      - .github/workflows/garnet-shadow-mirror.yml
      - .github/workflows/garnet-record.yml
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      prs:
        description: Optional space-separated change numbers
        required: false
        type: string
      lookback_days:
        description: Days of merged dependency changes to replay
        required: false
        default: '10'
        type: string
permissions: {}
concurrency:
  group: shadow-dependency-mirror
  cancel-in-progress: false
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test shadow mirror
        run: python3 -m unittest discover -s .github/scripts/shadow_mirror

  sync:
    if: github.repository == 'garnet-labs/sentry-javascript' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PRS: ${{ inputs.prs }}
      LOOKBACK_DAYS: ${{ inputs.lookback_days || '10' }}
    steps:
      - name: Check authentication
        id: auth
        env:
          SHADOW_MIRROR_TOKEN: ${{ secrets.SHADOW_MIRROR_TOKEN }}
        run: |
          if [ -z "$SHADOW_MIRROR_TOKEN" ]; then
            echo '::error::Set the SHADOW_MIRROR_TOKEN secret to a PAT with write access to Contents, Pull requests, Actions, and Workflows.'
            exit 1
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.auth.outputs.enabled == 'true'
        with:
          sparse-checkout: .github/scripts/shadow_mirror
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Sync dependency changes
        if: steps.auth.outputs.enabled == 'true'
        env:
          SHADOW_MIRROR_TOKEN: ${{ secrets.SHADOW_MIRROR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$LOOKBACK_DAYS" =~ ^[0-9]+$ ]] || { echo 'Invalid lookback'; exit 1; }
          args=(--lookback-days "$LOOKBACK_DAYS")
          for pr in $PRS; do
            [[ "$pr" =~ ^[0-9]+$ ]] || { echo 'Invalid change number'; exit 1; }
            args+=(--pr "$pr")
          done
          python3 .github/scripts/shadow_mirror/mirror.py sync "${args[@]}"
