name: Garnet Runtime Visibility

on:
  push:
    branches: ['develop', 'record-base/**']
  pull_request:

permissions: {}

concurrency:
  group: garnet-install-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  dep-install:
    name: Workspace dependency install (recorded)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ hashFiles('yarn.lock') != '' && '20.19.2' || '24.22.1' }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: hashFiles('yarn.lock') == ''
      - name: Select upstream Yarn version
        if: hashFiles('yarn.lock') != ''
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
      - uses: garnet-org/action@673a06d87748bec49e4d8df22d371b2a3420aba4 # v2.5.2
      - name: Install workspace dependencies with lifecycle scripts
        env:
          npm_config_ignore_scripts: 'false'
          YARN_IGNORE_SCRIPTS: 'false'
        run: |
          if [ -f yarn.lock ]; then
            yarn install --frozen-lockfile --non-interactive
          else
            pnpm install --frozen-lockfile
          fi
      - name: Let sensor settle
        if: always()
        run: sleep 30
